# === Server ===
# The original file set this twice (8081, then a stray-indented 8082
# line further down) — Spring Boot resolves duplicate keys by taking
# the LAST one read, so the app was actually already running on 8082,
# matching README.md and the frontend's expected VITE_API_URL. Fixed
# here to a single, explicit value so that's no longer accidental.
server.port=${SERVER_PORT:8082}

# === PostgreSQL Database ===
# Was previously hardcoded here as plaintext, including a real password
# committed to source control — see README "Security notes" for why
# that credential should be rotated regardless of this change. Values
# now come from environment variables with local-dev-friendly defaults
# for username/URL only; there is deliberately NO default for the
# password, so the app fails to start with a clear error if
# DB_PASSWORD isn't set, rather than silently falling back to a
# committed secret.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/terramatch_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === JWT ===
# Same reasoning as the DB password: no default, so a missing
# JWT_SECRET fails fast at startup instead of silently reusing the
# secret that was previously committed to this repo.
# For HS512, the JWT secret must be a Base64-encoded key >= 512 bits.
# Generate one with Keys.secretKeyFor(SignatureAlgorithm.HS512) and store
# the Base64 value in JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# === CORS ===
# Comma-separated list of exact origins allowed to make credentialed
# requests. Was previously allowedOriginPatterns(List.of("*")) with
# allowCredentials(true) — see SecurityConfig's notes on why that
# combination is broader than "just the dev frontend" in practice.
# Defaults to Vite's usual dev port; add your deployed frontend's
# origin here (comma-separated, no trailing slash) for staging/prod.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
